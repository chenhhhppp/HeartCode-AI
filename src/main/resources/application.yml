spring:
  application:
    name: HeartCode
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heartcode?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: <Your Password>
server:
  port: 8123
  servlet:
    context-path: /api
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.chp.heartcode.controller
knife4j:
  enable: true
  setting:
    language: zh-CN
# AI
langchain4j:
  open-ai:
    chat-model:
      api-key: <Your API Key>
      base-url: https://open.bigmodel.cn/api/coding/paas/v4
      model-name: glm-5.2
      log-requests: true
      log-responses: true
      max-tokens: 90000
      timeout: 6000s
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      api-key: <Your API Key>
      base-url: https://open.bigmodel.cn/api/coding/paas/v4
      model-name: glm-5.2
      log-requests: true
      log-responses: true
      max-tokens: 90000
      timeout: 6000s
      strict-json-schema: true
      response-format: json_object